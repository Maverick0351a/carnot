[package]
name = "carnot"
version = "0.5.0"
edition = "2021"
rust-version = "1.83"
description = "Clean-room license firewall, polyglot project emitter, and worktree organ evolver."
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Maverick0351a/carnot"
keywords = ["clean-room", "license", "codegen", "cli", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
