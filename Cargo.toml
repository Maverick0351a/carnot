[package]
name = "carnot"
version = "0.5.0"
edition = "2021"
description = "Carnot: Clean-room software deconstruction, polyglot synthesis, Pareto conformance verification, and sub-millisecond strangler-fig canary cutover engine."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Maverick0351a/carnot"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
